[package]
name = "symseek"
version = "0.1.0"
edition = "2024"
description = "A simple utility to trace symlinks recursively"
repository = "https://github.com/merrkry/symseek"
license = "GPL-3.0-or-later"
keywords = ["cli"]
categories = ["command-line-utilities"]

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive"] }
content_inspector = "0.2"
path-clean = "1.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
termtree = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8.0"

[dev-dependencies]
assert_fs = "1.1"
